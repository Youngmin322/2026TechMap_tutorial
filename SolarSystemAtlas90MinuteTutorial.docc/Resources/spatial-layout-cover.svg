  <rect width="1200" height="675" fill="url(#space)"/>
  <g fill="#fff" opacity=".65"><circle cx="91" cy="84" r="2"/><circle cx="1067" cy="91" r="3"/><circle cx="1030" cy="566" r="2"/><circle cx="174" cy="593" r="2"/><circle cx="822" cy="110" r="2"/></g>
